[versions]
agp = "8.7.1"
kotlin = "2.1.0"
hilt = "2.51.1"
ksp = "2.1.0-1.0.29"
room = "2.6.1"
lifecycle = "2.8.2"
navigation = "2.7.7"
coil = "2.6.0"
gson = "2.11.0"
retrofit = "2.11.0"
okhttp = "4.12.1"
material = "1.12.0"
junit = "4.13.2"
androidx-test = "1.1.5"
espresso = "3.5.1"

[libraries]
